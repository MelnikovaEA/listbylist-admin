services:
  postgres:
    image: postgres:16
    container_name: checklist_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - checklist_postgres_data:/var/lib/postgresql/data

volumes:
  checklist_postgres_data:
